server:
  port: 8084


spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://localhost:3306/product_service_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: "*"
        
        
jwt:
  secret: naresh_00001
  expiration: 86400000